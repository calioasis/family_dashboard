<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f5f2;
    --surface: #ffffff;
    --surface2: #f2f0ed;
    --border: #e8e4df;
    --text: #1a1917;
    --muted: #9b958d;
    --accent: #2d6a4f;
    --accent-light: #e8f4ef;
    --accent2: #b5451b;
    --ink: #3d3a36;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── TOP BAR ── */
  .topbar {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    align-items: center;
    padding: 14px 48px 0;
    flex-shrink: 0;
  }
  .topbar.marquee-mode {
    grid-template-columns: 220px 1fr 220px;
  }

  .date-block .weekday {
    font-family: 'Lora', serif;
    font-size: 2rem;
    font-weight: 400;
    line-height: 1;
  }
  .date-time-row {
    display: flex;
    align-items: baseline;
    gap: 6px;
    margin-top: 4px;
  }
  .date-block .full-date {
    font-size: 0.78rem;
    color: var(--muted);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .date-sep { font-size: 0.78rem; color: var(--border); }
  .date-block .time {
    font-size: 0.82rem;
    color: var(--ink);
    letter-spacing: 0.02em;
  }

  .family-center {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
  }
  .family-name {
    font-family: 'Lora', serif;
    font-size: 1.5rem;
    font-weight: 400;
    font-style: italic;
    color: var(--ink);
    text-align: center;
    letter-spacing: 0.01em;
  }
  .family-subtitle {
    font-family: 'Lora', serif;
    font-size: 0.85rem;
    font-weight: 400;
    color: var(--accent2);
    text-align: center;
    letter-spacing: 0.01em;
  }
  .family-subtitle:empty { display: none; }

  /* ── MARQUEE ── */
  .marquee-wrap {
    overflow: hidden;
    width: 100%;
    display: flex;
    align-items: center;
  }
  .marquee-inner {
    display: flex;
    white-space: nowrap;
    animation: scroll-marquee 22s linear infinite;
  }
  .marquee-text {
    display: inline-block;
    white-space: nowrap;
    font-family: 'Lora', serif;
    font-size: 1.7rem;
    font-weight: 400;
    font-style: italic;
    color: #d4a84b;
  }
  @keyframes scroll-marquee {
    from { transform: translateX(0); }
    to   { transform: translateX(-50%); }
  }

  /* ── WEATHER TOPBAR ── */
  .weather-topbar {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    text-align: right;
  }
  .weather-current {
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  .wc-icon { font-size: 1.4rem; line-height: 1; }
  .wc-temp {
    font-family: 'Lora', serif;
    font-size: 1.6rem;
    font-weight: 400;
    line-height: 1;
    color: var(--ink);
  }
  .wc-desc {
    font-size: 0.72rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-top: 3px;
  }
  .wc-precip {
    font-size: 0.72rem;
    color: #4a90c4;
    margin-top: 4px;
    letter-spacing: 0.02em;
  }

  /* ── COL RIGHT ── */
  .col-right {
    display: flex;
    flex-direction: column;
    gap: 20px;
    min-height: 0;
    overflow: hidden;
  }

  /* ── CARD LABEL (replaces card-head for compact cards) ── */
  .card-label {
    font-size: 0.62rem;
    text-transform: uppercase;
    letter-spacing: 0.09em;
    color: var(--muted);
    padding: 7px 24px 4px;
    flex-shrink: 0;
    border-bottom: 1px solid var(--border);
  }

  /* ── SCORES / STANDINGS ── */
  .col-right > .card { flex: 1; min-height: 0; }
  .scores-card { flex: 1; min-height: 0; }
  .scores-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 8px 0;
    min-height: 0;
  }
  .score-item {
    padding: 10px 24px;
    border-bottom: 1px solid var(--border);
  }
  .score-item:last-child { border-bottom: none; }
  .score-matchup {
    font-size: 0.82rem;
    color: var(--ink);
    margin-bottom: 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .score-vs { color: var(--muted); margin: 0 5px; }
  .score-line { display: flex; align-items: baseline; gap: 8px; }
  .score-result {
    font-family: 'Lora', serif;
    font-size: 1.05rem;
    color: var(--ink);
  }
  .score-when { font-size: 0.7rem; color: var(--muted); }

  /* ── RULE ── */
  .rule {
    margin: 16px 48px 16px;
    height: 1px;
    background: var(--border);
    flex-shrink: 0;
  }

  /* ── MAIN ── */
  .main {
    display: grid;
    grid-template-columns: 1.1fr 1fr 0.9fr;
    gap: 20px;
    padding: 0 48px 0;
    flex: 1;
    min-height: 0;
    overflow: hidden;
  }

  /* ── CARD ── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-height: 0;
  }

  .card-head {
    padding: 18px 24px 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .card-head h2 {
    font-family: 'Lora', serif;
    font-size: 1rem;
    font-weight: 400;
    font-style: italic;
    color: var(--ink);
  }
  .card-badge {
    font-size: 0.7rem;
    color: var(--muted);
    letter-spacing: 0.04em;
  }

  /* ── AGENDA ── */
  .agenda-scroll {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 8px 0;
    min-height: 0;
  }

  .agenda-item {
    display: flex;
    align-items: flex-start;
    padding: 11px 24px;
    border-bottom: 1px solid var(--border);
    position: relative;
    gap: 0;
  }
  .agenda-item:last-child { border-bottom: none; }
  .agenda-item.past { opacity: 0.35; }
  .agenda-item.current { background: var(--accent-light); }
  .agenda-item::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--cal-color, var(--border));
    border-radius: 0 2px 2px 0;
  }

  .agenda-time-col {
    width: 72px;
    flex-shrink: 0;
    padding-top: 1px;
  }
  .t { font-size: 0.83rem; font-weight: 500; color: var(--ink); }
  .t2 { font-size: 0.71rem; color: var(--muted); margin-top: 1px; }
  .allday { font-size: 0.71rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }

  .agenda-body { flex: 1; min-width: 0; overflow: hidden; }
  .agenda-title { font-size: 0.92rem; font-weight: 500; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .agenda-loc { font-size: 0.75rem; color: var(--muted); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ── UPCOMING ── */
  .upcoming-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 8px 0;
    min-height: 0;
  }

  .upcoming-item {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 11px 24px;
    border-bottom: 1px solid var(--border);
  }
  .upcoming-item:last-child { border-bottom: none; }

  .cdown {
    width: 54px;
    flex-shrink: 0;
    text-align: center;
    padding: 6px 0;
    border-radius: 8px;
    background: var(--surface2);
    border: 1px solid var(--border);
  }
  .cdown .n {
    font-family: 'Lora', serif;
    font-size: 1.5rem;
    line-height: 1;
    color: var(--ink);
  }
  .cdown .lbl {
    font-size: 0.58rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin-top: 1px;
  }
  .cdown.imminent { background: #fef3ee; border-color: #f5c8b4; }
  .cdown.imminent .n { color: var(--accent2); }
  .cdown.soon { background: var(--accent-light); border-color: #b2d8c7; }
  .cdown.soon .n { color: var(--accent); }

  .cal-dot {
    display: inline-block;
    width: 7px; height: 7px;
    border-radius: 50%;
    margin-right: 6px;
    vertical-align: middle;
    flex-shrink: 0;
  }

  .upcoming-body { flex: 1; }
  .upcoming-title { font-size: 0.9rem; font-weight: 500; }
  .upcoming-date { font-size: 0.73rem; color: var(--muted); margin-top: 2px; }

  /* ── EMPTY ── */
  .empty {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    flex: 1;
    color: var(--muted);
    font-size: 0.85rem;
    font-style: italic;
    padding: 32px;
    text-align: center;
  }
  .empty-icon { font-size: 1.8rem; opacity: 0.45; }

  /* ── STATUS BAR ── */
  .statusbar {
    padding: 10px 48px 16px;
    display: flex;
    justify-content: space-between;
    font-size: 0.68rem;
    color: var(--muted);
    letter-spacing: 0.03em;
    flex-shrink: 0;
  }
  .dot {
    display: inline-block;
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--accent);
    margin-right: 5px;
    vertical-align: middle;
  }
  .dot.loading { animation: blink 1s infinite; background: #c8a040; }
  .dot.err { background: var(--accent2); }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.15} }

  /* ── DARK MODE ── */
  body.dark {
    --bg: #141210;
    --surface: #1e1b18;
    --surface2: #252119;
    --border: #332e28;
    --text: #f0ece6;
    --muted: #a09488;
    --accent: #4a9e74;
    --accent-light: #1a3329;
    --accent2: #d4a84b;
    --ink: #f0ece6;
  }

  /* ── THEME TOGGLE ── */
  #themeToggle {
    background: none;
    border: none;
    cursor: pointer;
    font-size: 1rem;
    padding: 3px 8px;
    border-radius: 6px;
    color: var(--muted);
    line-height: 1;
    transition: background 0.15s;
  }
  #themeToggle:hover, #themeToggle:focus {
    background: var(--surface2);
    outline: 1px solid var(--border);
  }

  /* scrollbars */
  .agenda-scroll::-webkit-scrollbar,
  .upcoming-scroll::-webkit-scrollbar,
  .scores-scroll::-webkit-scrollbar,
  .standings-scroll::-webkit-scrollbar { width: 3px; }
  .agenda-scroll::-webkit-scrollbar-track,
  .upcoming-scroll::-webkit-scrollbar-track,
  .scores-scroll::-webkit-scrollbar-track,
  .standings-scroll::-webkit-scrollbar-track { background: transparent; }
  .agenda-scroll::-webkit-scrollbar-thumb,
  .upcoming-scroll::-webkit-scrollbar-thumb,
  .scores-scroll::-webkit-scrollbar-thumb,
  .standings-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  /* ── MOBILE TAB BAR (hidden on desktop) ── */
  .mobile-tabbar { display: none; flex-shrink: 0; }

  @media (max-width: 768px) {
    /* Compact topbar: date left, weather right */
    .topbar {
      grid-template-columns: 1fr 1fr;
      padding: 12px 16px 10px;
    }
    .family-center { display: none; }
    .marquee-wrap { display: none !important; }
    .date-block .weekday { font-size: 1.4rem; }
    .date-block .full-date { font-size: 0.68rem; }
    .date-block .time, .date-sep { display: none; }
    .wc-temp { font-size: 1.3rem; }
    .wc-icon { font-size: 1.1rem; }

    body { height: 100dvh; }
    .rule { display: none; }
    .statusbar { display: none; }

    /* Main: drop the 3-col grid, become a flex column */
    .main {
      display: flex;
      flex-direction: column;
      padding: 0;
      gap: 0;
    }

    /* All panels hidden by default; active panel fills space */
    .tab-panel {
      display: none;
      border-radius: 0;
      border-left: none;
      border-right: none;
      border-bottom: none;
    }
    .tab-panel.active {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      border-top: 1px solid var(--border);
    }

    /* Baseball panel: stack cards, let the panel itself scroll */
    .col-right.tab-panel.active {
      overflow-y: auto;
      gap: 0;
      padding: 0;
    }
    .col-right > .card {
      flex: none;
      border-radius: 0;
      border: none;
      border-bottom: 1px solid var(--border);
    }
    .col-right > .card:last-child { border-bottom: none; }
    /* Remove internal scroll on baseball cards — panel scrolls instead */
    .scores-scroll { overflow: visible; flex: none; }

    /* Tighter horizontal padding inside cards on mobile */
    .card-label { padding-left: 16px; padding-right: 16px; }
    .standing-row { padding-left: 16px; padding-right: 16px; }
    .score-item { padding-left: 16px; padding-right: 16px; }
    .agenda-item { padding-left: 16px; padding-right: 16px; }
    .card-head { padding-left: 16px; padding-right: 16px; }
    .upcoming-item { padding-left: 16px; padding-right: 16px; }

    /* Mobile tab bar */
    .mobile-tabbar {
      display: flex;
      border-top: 1px solid var(--border);
      background: var(--surface);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    .mtab {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      padding: 10px 0;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted);
      transition: color 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .mtab.active { color: var(--accent); }
    .mtab-icon { font-size: 1.2rem; line-height: 1; }
    .mtab-label {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-family: 'Inter', sans-serif;
    }
  }
</style>
</head>
<body>

<!-- DASHBOARD -->
<div class="topbar">
  <div class="date-block">
    <div class="weekday" id="weekday">—</div>
    <div class="date-time-row">
      <span class="full-date" id="fullDate">—</span>
      <span class="date-sep">·</span>
      <span class="time" id="currentTime">—</span>
    </div>
  </div>
  <div class="family-center" id="familyCenter">
    <div class="family-name">Sherin Family</div>
    <div class="family-subtitle" id="familySubtitle"></div>
  </div>
  <div class="marquee-wrap" id="marqueeWrap" style="display:none">
    <div class="marquee-inner">
      <span class="marquee-text" id="marqueeText"></span>
      <span class="marquee-text" id="marqueeText2"></span>
    </div>
  </div>
  <div class="weather-topbar">
    <div class="weather-current">
      <span class="wc-icon" id="wIcon"></span>
      <span class="wc-temp" id="wTemp"></span>
    </div>
    <div class="wc-desc" id="wDesc"></div>
    <span class="card-badge" id="wHiLow"></span>
    <span class="wc-precip" id="wPrecip"></span>
  </div>
</div>

<div class="rule"></div>

<div class="main">
  <div class="card tab-panel active" id="panelToday">
    <div class="card-head">
      <h2 id="agendaHeader">Today</h2>
      <span class="card-badge" id="agendaBadge">—</span>
    </div>
    <div class="agenda-scroll" id="agendaList">
      <div class="empty"><span class="empty-icon">📅</span>Loading…</div>
    </div>
  </div>

  <div class="card tab-panel" id="panelUpcoming">
    <div class="card-head">
      <h2>Coming up</h2>
      <span class="card-badge">Next 30 days</span>
    </div>
    <div class="upcoming-scroll" id="upcomingList">
      <div class="empty"><span class="empty-icon">🗓</span>Loading…</div>
    </div>
  </div>

  <div class="col-right tab-panel" id="panelBaseball">
    <div class="card scores-card">
      <div class="card-label">Majors</div>
      <div class="scores-scroll" id="scoresList">
        <div class="empty"><span class="empty-icon">⚾</span>Loading…</div>
      </div>
    </div>

    <div class="card scores-card">
      <div class="card-label">Minor B</div>
      <div class="scores-scroll" id="scoresBList">
        <div class="empty"><span class="empty-icon">⚾</span>Loading…</div>
      </div>
    </div>
  </div>
</div>

<div class="mobile-tabbar" id="mobileTabbar">
  <button class="mtab active" data-panel="panelToday">
    <span class="mtab-icon">📅</span>
    <span class="mtab-label">Today</span>
  </button>
  <button class="mtab" data-panel="panelUpcoming">
    <span class="mtab-icon">🗓</span>
    <span class="mtab-label">Upcoming</span>
  </button>
  <button class="mtab" data-panel="panelBaseball">
    <span class="mtab-icon">⚾</span>
    <span class="mtab-label">Baseball</span>
  </button>
</div>

<div class="statusbar">
  <div><span class="dot loading" id="statusDot"></span><span id="statusText">Starting up…</span></div>
  <div style="display:flex;align-items:center;gap:16px">
    <button id="themeToggle" onclick="toggleTheme()" title="Toggle theme">☀️</button>
    <div id="statusRight">—</div>
  </div>
</div>

<script>
const CORS = 'https://calendar-proxy.jeffrey-sherin.workers.dev/?url=';
const SUBTITLE = 'Have a great day!';
const MARQUEE = false; // set to true to replace title/subtitle with scrolling marquee

let cfg = null;
let allEvents = [];
let showingTomorrow = false;

// ── PAGE RELOAD every 60 minutes ──
setTimeout(() => location.reload(), 60 * 60 * 1000);

// ── THEME ──
function applyTheme(theme) {
  document.body.classList.toggle('dark', theme === 'dark');
  document.getElementById('themeToggle').textContent = theme === 'dark' ? '☀️' : '🌙';
}
function toggleTheme() {
  const newTheme = document.body.classList.contains('dark') ? 'light' : 'dark';
  localStorage.setItem('dash_theme', newTheme);
  applyTheme(newTheme);
}
applyTheme(localStorage.getItem('dash_theme') || 'dark');

// ── SUBTITLE / MARQUEE ──
if (MARQUEE && SUBTITLE) {
  document.getElementById('familyCenter').style.display = 'none';
  document.getElementById('marqueeWrap').style.display = 'flex';
  document.getElementById('marqueeText').textContent = SUBTITLE;
  document.getElementById('marqueeText2').textContent = SUBTITLE;
  requestAnimationFrame(() => {
    const el = document.getElementById('marqueeText');
    const gap = window.innerWidth - el.getBoundingClientRect().width;
    el.style.paddingRight = gap + 'px';
    document.getElementById('marqueeText2').style.paddingRight = gap + 'px';
  });
  document.querySelector('.topbar').classList.add('marquee-mode');
} else if (SUBTITLE) {
  document.getElementById('familySubtitle').textContent = SUBTITLE;
}

// ── DATE ──
function tick() {
  const now = new Date();
  const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  document.getElementById('weekday').textContent = DAYS[now.getDay()];
  document.getElementById('fullDate').textContent = `${MONTHS[now.getMonth()]} ${now.getDate()}, ${now.getFullYear()}`;
  let h = now.getHours(), m = now.getMinutes();
  const ap = h >= 12 ? 'pm' : 'am';
  h = h % 12 || 12;
  document.getElementById('currentTime').textContent = `${h}:${String(m).padStart(2,'0')} ${ap}`;
}
setInterval(tick, 60000);
tick();

// ── WEATHER ──
async function fetchWeather(city) {
  try {
    const cityName = city.split(',')[0].trim();
    const g = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(cityName)}&count=1`);
    const gj = await g.json();
    if (!gj.results?.length) return;
    const { latitude: lat, longitude: lon } = gj.results[0];
    const w = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weathercode&hourly=precipitation_probability&daily=temperature_2m_max,temperature_2m_min&temperature_unit=fahrenheit&forecast_days=1&timezone=auto`);
    const wj = await w.json();
    const cur = wj.current, day = wj.daily, hourly = wj.hourly;

    document.getElementById('wIcon').textContent = wmoIcon(cur.weathercode);
    document.getElementById('wTemp').textContent = `${Math.round(cur.temperature_2m)}°`;
    document.getElementById('wDesc').textContent = wmoDesc(cur.weathercode);
    document.getElementById('wHiLow').textContent = `H: ${Math.round(day.temperature_2m_max[0])}°  ·  L: ${Math.round(day.temperature_2m_min[0])}°`;

    const now = new Date();
    const endOfDay = new Date(now); endOfDay.setHours(23, 59, 59, 999);
    const maxPrecip = Math.max(0, ...hourly.time
      .map((t, i) => ({ d: new Date(t), p: hourly.precipitation_probability[i] }))
      .filter(({ d }) => d >= now && d <= endOfDay)
      .map(({ p }) => p));
    const precipEl = document.getElementById('wPrecip');
    if (precipEl) precipEl.textContent = maxPrecip >= 20 ? `🌧 ${maxPrecip}% rain` : '';
  } catch(e) {
    const el = document.getElementById('wDesc');
    if (el) el.textContent = 'Weather unavailable';
  }
}

// ── ELL HELPERS ──
function ellFormFields(doc) {
  const f = {};
  doc.querySelectorAll('form#Form input[name]').forEach(i => {
    if (i.type === 'checkbox') { if (i.checked) f[i.name] = i.value || 'on'; }
    else if (!['submit','button','image','reset'].includes(i.type)) f[i.name] = i.value || '';
  });
  doc.querySelectorAll('form#Form select[name]').forEach(s => {
    const opt = s.querySelector('option[selected]');
    f[s.name] = opt ? opt.value : (s.options[0]?.value || '');
  });
  return f;
}
async function ellPost(url, fields) {
  const body = Object.entries(fields).map(([k,v]) => encodeURIComponent(k)+'='+encodeURIComponent(v||'')).join('&');
  const res = await fetch(CORS + encodeURIComponent(url), {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body
  });
  if (!res.ok) throw new Error('POST ' + res.status);
  return new DOMParser().parseFromString(await res.text(), 'text/html');
}
function ellScoresRows(doc) {
  for (const tbody of doc.querySelectorAll('table tbody')) {
    const trs = Array.from(tbody.querySelectorAll('tr'));
    if (trs.some(r => {
      const c = r.querySelectorAll('td');
      return c.length >= 2 && /^\d{1,2}\/\d{1,2}\/\d{4}$/.test(c[1]?.textContent?.trim());
    })) return trs;
  }
  return [];
}

// ── LITTLE LEAGUE SCORES ──
function renderScores(doc, elId) {
  const el = document.getElementById(elId);
  const rows = ellScoresRows(doc);
  const todayMidnight = new Date(); todayMidnight.setHours(0, 0, 0, 0);
  const targets = new Set();
  for (let d = 1; d <= 4; d++) {
    const dt = new Date(todayMidnight); dt.setDate(dt.getDate() - d);
    targets.add(`${String(dt.getMonth()+1).padStart(2,'0')}/${String(dt.getDate()).padStart(2,'0')}/${dt.getFullYear()}`);
  }
  const games = [];
  for (const row of rows) {
    const cells = Array.from(row.querySelectorAll('td'));
    if (cells.length < 7) continue;
    const date = cells[1]?.textContent?.trim();
    if (!targets.has(date)) continue;
    const away = cells[4]?.textContent?.trim();
    const home = cells[5]?.textContent?.trim();
    const score = cells[6]?.textContent?.trim();
    if (away && home && score && /\d/.test(score)) {
      const [mm, dd, yyyy] = date.split('/');
      games.push({ date, away, home, score, ts: new Date(+yyyy, +mm-1, +dd) });
    }
  }
  games.sort((a, b) => b.ts - a.ts);
  if (!games.length) {
    el.innerHTML = '<div class="empty"><span class="empty-icon">⚾</span>No games in the last 4 days</div>';
    return;
  }
  el.innerHTML = games.map(g => {
    const [mm, dd, yyyy] = g.date.split('/');
    const diffDays = Math.round((todayMidnight - new Date(+yyyy, +mm - 1, +dd)) / 86400000);
    const when = diffDays === 1 ? 'Yesterday' : `${diffDays}d ago`;
    return `<div class="score-item">
      <div class="score-matchup"><span class="score-team">${g.away}</span><span class="score-vs">vs</span><span class="score-team">${g.home}</span></div>
      <div class="score-line"><span class="score-result">${g.score}</span><span class="score-when">${when}</span></div>
    </div>`;
  }).join('');
}

// ── ICS PARSER ──
function parseICS(text) {
  const evts = [];
  const lines = text.replace(/\r\n /g,'').replace(/\r\n/g,'\n').replace(/\r/g,'\n').split('\n');
  let e = null;
  for (const line of lines) {
    if (line === 'BEGIN:VEVENT') { e = {}; continue; }
    if (line === 'END:VEVENT') { if (e?.summary) evts.push(e); e = null; continue; }
    if (!e) continue;
    const ci = line.indexOf(':');
    if (ci < 0) continue;
    const key = line.slice(0, ci).split(';')[0].toUpperCase();
    const val = line.slice(ci + 1).trim();
    if (key === 'SUMMARY') e.summary = val.replace(/\\n/g,' ').replace(/\\,/g,',').replace(/\\;/g,';');
    else if (key === 'DTSTART') e.start = parseICSDate(val, line);
    else if (key === 'DTEND') e.end = parseICSDate(val, line);
    else if (key === 'LOCATION') e.location = val.replace(/\\n/g,' ').replace(/\\,/g,',');
    else if (key === 'RRULE') e.rrule = val;
    else if (key === 'EXDATE') {
      const dates = val.split(',').map(d => parseICSDate(d.trim(), d.trim()));
      e.exdates = [...(e.exdates || []), ...dates];
    }
  }
  return evts;
}

function parseICSDate(val, rawLine) {
  const allDay = rawLine.includes('VALUE=DATE') || /^\d{8}$/.test(val);
  val = val.replace(/^[^:]*:/,'');
  if (allDay || /^\d{8}$/.test(val)) {
    const d = new Date(+val.slice(0,4), +val.slice(4,6)-1, +val.slice(6,8));
    d.allDay = true;
    return d;
  }
  if (val.endsWith('Z')) {
    return new Date(Date.UTC(+val.slice(0,4), +val.slice(4,6)-1, +val.slice(6,8), +val.slice(9,11), +val.slice(11,13), +val.slice(13,15)));
  }
  return new Date(+val.slice(0,4), +val.slice(4,6)-1, +val.slice(6,8), +val.slice(9,11), +val.slice(11,13), +val.slice(13,15));
}

// ── RRULE EXPANDER ──
function parseRRule(str) {
  const DAY_MAP = { SU:0, MO:1, TU:2, WE:3, TH:4, FR:5, SA:6 };
  const r = { interval: 1 };
  str.split(';').forEach(p => {
    const [k, v] = p.split('=');
    if (k === 'FREQ') r.freq = v;
    else if (k === 'INTERVAL') r.interval = parseInt(v) || 1;
    else if (k === 'COUNT') r.count = parseInt(v);
    else if (k === 'UNTIL') r.until = new Date(v.replace(/(\d{4})(\d{2})(\d{2}).*/,'$1-$2-$3'));
    else if (k === 'BYDAY') r.byday = v.split(',').map(d => DAY_MAP[d.replace(/[+-]?\d*/g,'')]).filter(d => d !== undefined);
  });
  return r;
}

function expandRecurring(evt, winStart, winEnd) {
  if (!evt.rrule) return (evt.start >= winStart && evt.start <= winEnd) ? [evt] : [];
  const rule = parseRRule(evt.rrule);
  const results = [];
  const dur = evt.end ? evt.end - evt.start : 0;
  let occCount = 0;
  let cursor = new Date(evt.start);
  const multiDay = rule.freq === 'WEEKLY' && rule.byday && rule.byday.length > 1;

  for (let i = 0; i < 500 && cursor <= winEnd; i++) {
    if (rule.until && cursor > rule.until) break;
    if (rule.count !== undefined && occCount >= rule.count) break;

    let match = false;
    if (rule.freq === 'DAILY') {
      match = true;
    } else if (rule.freq === 'WEEKLY') {
      const weekOffset = Math.round((cursor - evt.start) / (7 * 86400000));
      if (weekOffset % rule.interval === 0)
        match = !rule.byday || rule.byday.includes(cursor.getDay());
    } else if (rule.freq === 'MONTHLY') {
      match = cursor.getDate() === evt.start.getDate();
    } else if (rule.freq === 'YEARLY') {
      match = cursor.getMonth() === evt.start.getMonth() && cursor.getDate() === evt.start.getDate();
    }

    const excluded = match && evt.exdates?.some(ex => sameDay(ex, cursor) && (ex.allDay || ex.getHours() === cursor.getHours()));
    if (match && !excluded) {
      occCount++;
      if (cursor >= winStart) {
        const occ = { ...evt, start: new Date(cursor) };
        if (evt.start.allDay) occ.start.allDay = true;
        if (dur > 0) { occ.end = new Date(cursor.getTime() + dur); if (evt.end?.allDay) occ.end.allDay = true; }
        results.push(occ);
      }
    }

    const next = new Date(cursor);
    if (rule.freq === 'DAILY') next.setDate(next.getDate() + rule.interval);
    else if (rule.freq === 'WEEKLY') next.setDate(next.getDate() + (multiDay ? 1 : 7 * rule.interval));
    else if (rule.freq === 'MONTHLY') next.setMonth(next.getMonth() + rule.interval);
    else if (rule.freq === 'YEARLY') next.setFullYear(next.getFullYear() + rule.interval);
    cursor = next;
  }
  return results;
}

// ── FETCH ──
async function fetchCalendar(url, color) {
  url = url.replace(/^webcal:\/\//i, 'https://');
  try {
    const res = await fetch(CORS + encodeURIComponent(url));
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    const winStart = new Date(); winStart.setDate(winStart.getDate() - 1);
    const winEnd = new Date(); winEnd.setDate(winEnd.getDate() + 60);
    return parseICS(text).flatMap(e => expandRecurring(e, winStart, winEnd)).map(e => ({ ...e, color }));
  } catch(e) {
    console.warn('Calendar fetch failed:', e);
    return null;
  }
}

// ── HELPERS ──
function sameDay(a, b) {
  return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
}
function fmtTime(dt) {
  if (!dt || dt.allDay) return null;
  let h = dt.getHours(), m = dt.getMinutes();
  const ap = h >= 12 ? 'pm' : 'am';
  h = h % 12 || 12;
  return `${h}:${String(m).padStart(2,'0')} ${ap}`;
}
const DAY_SHORT = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MON_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

// ── RENDER AGENDA ──
function renderAgenda(events) {
  const now = new Date();
  const today = events.filter(e => e.start && sameDay(e.start, now));
  today.sort((a,b) => {
    if (a.start.allDay && !b.start.allDay) return -1;
    if (!a.start.allDay && b.start.allDay) return 1;
    return a.start - b.start;
  });

  const allPast = today.length === 0 || today.every(e => !e.start.allDay && e.end && e.end < now);
  const tomorrow = new Date(now); tomorrow.setDate(tomorrow.getDate() + 1);

  let displayEvents = today;
  if (allPast) {
    showingTomorrow = true;
    displayEvents = events.filter(e => e.start && sameDay(e.start, tomorrow));
    displayEvents.sort((a,b) => {
      if (a.start.allDay && !b.start.allDay) return -1;
      if (!a.start.allDay && b.start.allDay) return 1;
      return a.start - b.start;
    });
  } else {
    showingTomorrow = false;
  }

  document.getElementById('agendaHeader').textContent = showingTomorrow ? 'Tomorrow' : 'Today';
  document.getElementById('agendaBadge').textContent = `${displayEvents.length} event${displayEvents.length!==1?'s':''}`;
  const el = document.getElementById('agendaList');

  if (!displayEvents.length) {
    el.innerHTML = `<div class="empty"><span class="empty-icon">${showingTomorrow ? '😴' : '🎉'}</span>Nothing scheduled ${showingTomorrow ? 'tomorrow' : 'today'}</div>`;
    return;
  }

  el.innerHTML = displayEvents.map(evt => {
    const past = !showingTomorrow && !evt.start.allDay && evt.end && evt.end < now;
    const current = !showingTomorrow && !evt.start.allDay && evt.start <= now && (!evt.end || evt.end >= now);
    const cls = past ? 'past' : current ? 'current' : '';
    const t1 = fmtTime(evt.start);
    const t2 = fmtTime(evt.end);
    const timeHTML = t1
      ? `<div class="t">${t1}</div>${t2 ? `<div class="t2">${t2}</div>` : ''}`
      : `<div class="allday">All day</div>`;
    return `<div class="agenda-item ${cls}" style="--cal-color: ${evt.color || 'var(--border)'}">
      <div class="agenda-time-col">${timeHTML}</div>
      <div class="agenda-body">
        <div class="agenda-title">${evt.summary}</div>
        ${evt.location ? `<div class="agenda-loc">📍 ${evt.location}</div>` : ''}
      </div>
    </div>`;
  }).join('');
}

// ── RENDER UPCOMING ──
function renderUpcoming(events) {
  const now = new Date();
  const cutoff = new Date(now); cutoff.setDate(cutoff.getDate() + 30);

  const tomorrow = new Date(now); tomorrow.setDate(tomorrow.getDate() + 1);
  const upcoming = events
    .filter(e => {
      if (!e.start || e.start <= now || sameDay(e.start, now) || e.start > cutoff) return false;
      if (showingTomorrow && sameDay(e.start, tomorrow)) return false;
      return true;
    })
    .sort((a,b) => a.start - b.start)
    .slice(0, 14);

  const el = document.getElementById('upcomingList');
  if (!upcoming.length) {
    el.innerHTML = '<div class="empty"><span class="empty-icon">😌</span>Nothing in the next 30 days</div>';
    return;
  }

  el.innerHTML = upcoming.map(evt => {
    const msPerDay = 86400000;
    const days = Math.ceil((evt.start - now) / msPerDay);
    const cls = days <= 1 ? 'imminent' : days <= 5 ? 'soon' : '';
    const dateStr = `${DAY_SHORT[evt.start.getDay()]}, ${MON_SHORT[evt.start.getMonth()]} ${evt.start.getDate()}`;
    const fmtRange = (start, end) => {
      if (!start || start.allDay) return '';
      const ap1 = start.getHours() >= 12 ? 'pm' : 'am';
      const fmt = dt => { let h = dt.getHours(), m = dt.getMinutes(); h = h % 12 || 12; return `${h}:${String(m).padStart(2,'0')}`; };
      if (!end || end.allDay) return `${fmt(start)} ${ap1}`;
      const ap2 = end.getHours() >= 12 ? 'pm' : 'am';
      return ap1 === ap2 ? `${fmt(start)}–${fmt(end)} ${ap2}` : `${fmt(start)} ${ap1}–${fmt(end)} ${ap2}`;
    };
    const timeStr = fmtRange(evt.start, evt.end);
    return `<div class="upcoming-item">
      <div class="cdown ${cls}">
        <div class="n">${evt.start.getDate()}</div>
        <div class="lbl">${DAY_SHORT[evt.start.getDay()]}</div>
      </div>
      <div class="upcoming-body">
        <div class="upcoming-title"><span class="cal-dot" style="background:${evt.color || 'var(--border)'}"></span>${evt.summary}</div>
        <div class="upcoming-date">${dateStr}${timeStr ? ' · ' + timeStr : ''}</div>
      </div>
    </div>`;
  }).join('');
}

// ── STATUS ──
function setStatus(type, msg, right) {
  const dot = document.getElementById('statusDot');
  dot.className = 'dot ' + (type || '');
  document.getElementById('statusText').textContent = msg;
  if (right !== undefined) document.getElementById('statusRight').textContent = right;
}

// ── LOAD CALENDARS ──
async function loadCalendars() {
  if (!cfg?.calendars?.length) return;
  setStatus('loading', 'Fetching calendars…');
  const results = await Promise.all(cfg.calendars.map(cal => fetchCalendar(cal.url, cal.color)));
  const succeeded = results.filter(Boolean);
  if (!succeeded.length) {
    setStatus('err', 'Could not load calendars — will retry in 15 min');
    return;
  }
  const now = new Date();
  const past = new Date(now); past.setDate(past.getDate() - 1);
  const future = new Date(now); future.setDate(future.getDate() + 60);
  allEvents = succeeded.flat().filter(e => e.start && e.start >= past && e.start <= future);
  renderAgenda(allEvents);
  renderUpcoming(allEvents);
  setStatus('', `Live · ${allEvents.length} events`, `Updated ${now.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}`);
}


// ── MOBILE TABS ──
function initMobileTabs() {
  document.querySelectorAll('.mtab').forEach(btn => {
    btn.addEventListener('click', () => {
      const panelId = btn.dataset.panel;
      document.querySelectorAll('.mtab').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById(panelId).classList.add('active');
    });
  });
}

function init() {
  if (cfg.city) fetchWeather(cfg.city);
  loadCalendars();
  fetchScores();
  initMobileTabs();
  setInterval(loadCalendars, 15 * 60 * 1000);
  if (cfg.city) setInterval(() => fetchWeather(cfg.city), 30 * 60 * 1000);
  setInterval(fetchScores, 60 * 60 * 1000);
}
